[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shopstream-sdk"
version = "0.1.0"
description = "Python SDK for the ShopStream Public API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []  # только стандартная библиотека

[tool.setuptools.packages.find]
include = ["shopstream*"]
